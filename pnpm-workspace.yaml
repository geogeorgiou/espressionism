packages:
  - packages/*

catalog:
  vite-plus: 1.3.0
  '@vitest/coverage-v8': 5.0.5
  typescript: ^6.0.3
  '@types/node': ^24.5.2
  actions-up: 2.0.0

allowBuilds:
  esbuild: true

overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest@*: 5.0.5
  # seroval 1.7.2 dropped provenance (1.7.0/1.7.1 were published from CI with
  # SLSA attestations). Pin the last attested release until that is resolved.
  seroval: 1.7.1
  seroval-plugins: 1.7.1

peerDependencyRules:
  allowAny:
    - vite
    
# Supply-chain hardening
strictDepBuilds: true
minimumReleaseAge: 2880
trustPolicy: no-downgrade
# semver 6.x predates npm provenance; 7.x has it, so 6.3.1 reads as a
# downgrade. Required by @babel/core (via shadcn). Pin the exception exactly.
trustPolicyExclude:
  - semver@6.3.1    