  '@ai-sdk/react': ^4.0.166
  '@types/node': ^24.5.2
  '@vitest/coverage-v8': 5.0.5
  actions-up: 2.0.0
  ai: ^7.0.162
  typescript: ^6.0.3
  vite-plus: 1.3.0
  zod: ^4.6.7

minimumReleaseAge: 2880

overrides:
