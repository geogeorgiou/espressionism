name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs vp, Node (from .nvmrc) and pnpm, then runs `vp install`
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .nvmrc
          cache: true

      - name: Check (format, lint, types)
        run: pnpm check

      - name: Test
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .nvmrc
          cache: true

      - name: Install Playwright browser
        run: pnpm --filter @espressionism/client exec playwright install --with-deps chromium

      # Builds the app and serves it with `vp preview` (playwright.config.ts)
      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/client/playwright-report/
          retention-days: 7
