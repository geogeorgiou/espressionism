name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs vp, Node (from .nvmrc) and pnpm, then runs `vp install`
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .nvmrc
          cache: true

      - name: Check (format, lint, types)
        run: pnpm check

      # Package and client import layers (.dependency-cruiser.mjs)
      - name: Import boundaries
        run: pnpm lint:boundaries

      - name: Test
        run: pnpm test:unit

      - name: Mutation tooling tests
        run: pnpm test:mutation-tooling

      - name: Build
        run: pnpm build

      - name: API key stays out of the bundle
        run: pnpm check:secrets

      # Loads api/*.ts with Node's own loader, as Vercel does
      - name: Vercel Functions load
        run: pnpm check:api

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .nvmrc
          cache: true

      - name: Install Playwright browser
        run: pnpm --filter @espressionism/client exec playwright install --with-deps chromium

      # Builds the app and serves it with `vp preview` (playwright.config.ts)
      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: packages/client/playwright-report/
          retention-days: 7

  # docs/adr/0001-adopt-stryker-mutation-testing.md
  mutation:
    name: Mutation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .nvmrc
          cache: true

      - name: Restore the incremental baselines
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/*/reports/stryker-incremental.json
          key: stryker-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          restore-keys: stryker-pr-${{ github.event.pull_request.number }}-

      - name: Mutation test
        env:
          MUTATION_BASE: origin/${{ github.base_ref }}
        run: pnpm test:mutation

      - name: Report
        if: always()
        run: node scripts/mutation-report.ts

      - name: Upload the HTML reports
        if: always() && hashFiles('packages/*/reports/mutation/mutation.html') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: packages/*/reports/mutation/mutation.html
          retention-days: 14

      - name: Save the incremental baselines
        if: always() && hashFiles('packages/*/reports/stryker-incremental.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/*/reports/stryker-incremental.json
          key: stryker-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
